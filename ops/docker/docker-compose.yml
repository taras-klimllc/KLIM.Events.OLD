services:
  # KLIM Events Service
  klim-events:
    build:
      context: .
      dockerfile: src/KLIM.Events.Service/Dockerfile
      target: runtime
    image: klim/events-service:${VERSION:-latest}
    container_name: klim-events-service
    environment:
      # Application Configuration
      DOTNET_ENVIRONMENT: "${DOTNET_ENVIRONMENT:-Production}"
      
      # Database Configuration
      Database__ConnectionString: "${DATABASE__CONNECTIONSTRING:?DATABASE__CONNECTIONSTRING is required}"
      Database__UseAzureAd: "${DATABASE__USEAZUREAD:-true}"
      
      # RabbitMQ Configuration
      RabbitMQ__Host: "${RABBITMQ__HOST:-host.docker.internal}"
      RabbitMQ__Username: "${RABBITMQ__USERNAME:-guest}"
      RabbitMQ__Password: "${RABBITMQ__PASSWORD:-guest}"
      RabbitMQ__ExchangeName: "${RABBITMQ__EXCHANGENAME:-klim.events}"
      RabbitMQ__RoutingKeyPrefix: "${RABBITMQ__ROUTINGKEYPREFIX:-klim.events}"
      
      # Change Tracking Configuration
      ChangeTracking__PollingIntervalSeconds: "${CHANGETRACKING__POLLINGINTERVALSECONDS:-5}"
      ChangeTracking__BatchSize: "${CHANGETRACKING__BATCHSIZE:-100}"
      
      # Outbox Configuration
      MassTransit__Outbox__Enabled: "${MASSTRANSIT__OUTBOX__ENABLED:-true}"
      MassTransit__Outbox__DeliveryIntervalSeconds: "${MASSTRANSIT__OUTBOX__DELIVERYINTERVALSECONDS:-2}"
      MassTransit__Outbox__BatchSize: "${MASSTRANSIT__OUTBOX__BATCHSIZE:-50}"
      MassTransit__Outbox__MaxConcurrentDispatches: "${MASSTRANSIT__OUTBOX__MAXCONCURRENTDISPATCHES:-5}"
      MassTransit__Outbox__RetentionDays: "${MASSTRANSIT__OUTBOX__RETENTIONDAYS:-7}"
      MassTransit__Outbox__CleanupIntervalHours: "${MASSTRANSIT__OUTBOX__CLEANUPINTERVALHOURS:-6}"
      
      # Azure AD Configuration (optional)
      AZURE_CLIENT_ID: "${AZURE_CLIENT_ID:-}"
      AZURE_CLIENT_SECRET: "${AZURE_CLIENT_SECRET:-}"
      AZURE_TENANT_ID: "${AZURE_TENANT_ID:-}"
      
      # Health Check Configuration
      Health__Port: "${HEALTH__PORT:-8080}"
      
      # Logging Configuration
      Serilog__MinimumLevel__Default: "${SERILOG__MINIMUMLEVEL__DEFAULT:-Information}"
      Serilog__MinimumLevel__Override__Microsoft: "${SERILOG__MINIMUMLEVEL__OVERRIDE__MICROSOFT:-Warning}"
    
    ports:
      - "${EVENTS_HEALTH_PORT:-8080}:8080"
    
    volumes:
      - ./logs:/app/logs                         # Mount logs for easy access
      - ~/.azure:/home/appuser/.azure:ro         # Mount Azure credentials (optional)
    
    networks:
      - klim-events
    
    restart: unless-stopped
    
    # Docker networking compatibility for external RabbitMQ
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Health check via HTTP endpoint
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    labels:
      - "klim.service=events-service"
      - "klim.version=${VERSION:-latest}"
      - "klim.type=worker-service"

# Networks
networks:
  klim-events:
    driver: bridge
    name: klim-events-network
    labels:
      - "klim.network=events"

# =============================================================================
# EXTERNAL DEPENDENCIES
# =============================================================================
# RabbitMQ: External container (competent_burnell - masstransitservices-rabbitmq:latest)
# Connection: localhost:5672 (AMQP), localhost:15672 (Management)
# Exchange: klim.events (configurable via RABBITMQ__EXCHANGENAME)
# Database: Azure SQL Database (configurable via DATABASE__CONNECTIONSTRING)
# Authentication: Azure AD (configurable via DATABASE__USEAZUREAD and Azure credentials)
# =============================================================================
